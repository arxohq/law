name: Refresh catalogue
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: catalogue-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Observe public deliveries
        id: observe
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run catalog:refresh
      - run: npm run check
      - name: Commit catalogue observations
        run: |
          git add catalog/snapshot.json docs/packages.md docs/ecosystem.md README.md
          if git diff --cached --quiet; then
            echo 'No catalogue changes.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Refresh public delivery catalogue'
            git push
          fi
      - name: Report incomplete observation
        if: steps.observe.outcome == 'failure'
        run: |
          echo 'Catalogue retained previous observations for unavailable sources.'
          exit 1
