<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280" role="img" aria-labelledby="title desc">
  <title id="title">From a fact and a rule to an explainable answer</title>
  <desc id="desc">The fact age Alice 20 and the rule Adult age at least 18 produce adult Alice yes. The explanation names the rule. Repeating the same input gives identical evaluation bytes.</desc>
  <style>
    :root{--bg:#ffffff;--ink:#18252d;--secondary:#3e5260;--line:#718994;--accent:#145e50;--fill:#edf8f4}
    @media(prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#f0f6fc;--secondary:#c4d1d9;--line:#829aa5;--accent:#8ce0c4;--fill:#142e29}}
    text{font-family:Arial,Helvetica,sans-serif;fill:var(--ink)}
    .label{font-size:17px;fill:var(--secondary)}
    .value{font-size:22px;font-weight:600}
    .edge{fill:none;stroke:var(--line);stroke-width:1.5}
  </style>
  <rect width="440" height="280" fill="var(--bg)"/>
  <path d="M108 92V113H220M332 92V113H220V132" class="edge"/>
  <path d="M215 125L220 132L225 125" class="edge"/>
  <rect x="10" y="14" width="196" height="78" rx="10" fill="var(--bg)" stroke="var(--line)"/>
  <text x="26" y="42" class="label">Supplied fact</text>
  <text x="26" y="72" class="value">Alice, age 20</text>
  <rect x="234" y="14" width="196" height="78" rx="10" fill="var(--bg)" stroke="var(--line)"/>
  <text x="250" y="42" class="label">Rule: Adult</text>
  <text x="250" y="72" class="value">age ≥ 18</text>
  <rect x="100" y="133" width="240" height="72" rx="10" fill="var(--fill)" stroke="var(--accent)"/>
  <text x="220" y="162" text-anchor="middle" class="label">Answer</text>
  <text x="220" y="190" text-anchor="middle" class="value">adult = yes</text>
  <path d="M220 205V227M106 227H334" class="edge"/>
  <text x="12" y="256" class="label">Why: applied Adult</text>
  <text x="242" y="256" class="label">Replay: identical</text>
</svg>
